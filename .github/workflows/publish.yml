name: publish

# Publishes `union-skills` to PyPI. Three ways in:
#
#   1. `release.yml` calls this as a job, passing the tag it just pushed. This is
#      the normal path. It has to be a job call rather than relying on the tag
#      push to trigger us: a tag pushed with GITHUB_TOKEN deliberately does NOT
#      start new workflow runs, so a `on: push: tags` trigger would never fire
#      for an automated release.
#   2. A human pushes a `v*` tag by hand. The fallback path, still supported.
#   3. Manual dispatch, for rehearsing. Defaults to dry_run, publishing nothing.
#
# npm publishing is DISABLED (see the `npm` job) while distribution focuses on
# pip/uvx. The npm package is still built, packed and validated on every run, so
# it stays releasable the moment that changes.
#
# One-time setup (see packaging/README.md):
#   - a GitHub environment named `pypi`
#   - a PyPI trusted publisher for `union-skills` pointing at this workflow file
#     and the `pypi` environment. Use a *pending* publisher before the first
#     release, since the project does not exist yet.
# No API token is stored anywhere; `id-token: write` is what authenticates.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.0.2"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only — do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # `inputs.tag` when called by release.yml; otherwise whatever ref fired us
      # (the tag for a tag push, the branch for a dispatch).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade build twine pytest pyyaml

      - id: version
        name: Read the version from the plugin manifest
        run: |
          VERSION=$(python packaging/build.py --print-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION"

      # A tag that disagrees with the manifest would publish a version nobody
      # can trace back to a commit, so fail loudly instead.
      - name: Tag must match the manifest version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "No tag to check (manual dispatch); skipping."
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match manifest version $VERSION. Run packaging/set_version.py ${TAG#v} and re-tag."
            exit 1
          fi
          echo "tag $TAG matches manifest $VERSION"

      # The content lint runs here too: a release is the last place to discover
      # that a skill links to a page that no longer exists.
      - name: Content and packaging checks
        run: |
          python -m pytest
          python packaging/verify.py

      - name: Build the release artifacts
        run: |
          set -euo pipefail
          python packaging/build.py --outdir build
          mkdir -p release-assets pypi-dist
          npm pack ./build/npm/union-skills --pack-destination release-assets
          (cd build/pypi/union-skills && python -m build)
          cp build/pypi/union-skills/dist/* pypi-dist/
          cp build/pypi/union-skills/dist/* release-assets/
          twine check pypi-dist/*

      # `npm publish --dry-run` runs the same validation as a real publish
      # (name, version, file list) without pushing anything to the registry.
      - name: npm publish --dry-run
        run: npm publish ./build/npm/union-skills --dry-run --access public

      - uses: actions/upload-artifact@v4
        with:
          name: npm-union-skills
          path: build/npm/union-skills
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-union-skills
          path: pypi-dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets

  pypi:
    needs: build
    # Publish when release.yml called us with a tag, or when a human pushed a
    # tag, or when a dispatch explicitly opted out of dry_run. A bare
    # `inputs.dry_run == false` would also be true when dry_run is simply absent
    # (a workflow_call declares no such input), so it is scoped to the dispatch.
    if: >-
      inputs.tag != ''
      || github.ref_type == 'tag'
      || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-union-skills
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release tag should be a no-op, not a hard failure.
          skip-existing: true

  # DISABLED: npm publishing is off while distribution focuses on pip/uvx.
  # To turn it on: restore the `if:` below to match the `pypi` job's condition,
  # then create an `npm` environment holding an NPM_TOKEN secret.
  #
  # npm needs a token for the FIRST publish, unlike PyPI: npm has no equivalent
  # of PyPI's pending publishers, and OIDC cannot perform a package's first
  # publish. Use a classic automation token, or a granular token scoped to "All
  # packages" — a token scoped to a specific package cannot cover a name that
  # does not exist yet. Tighten it after the first release, then switch to OIDC
  # trusted publishing (which also needs node-version >= 22, since npm >= 11.5.1
  # is required and the pinned Node 20 ships npm 10.x).
  #
  # The build job keeps packing and validating the npm package regardless, so
  # nothing rots while this is off.
  npm:
    needs: build
    if: false
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-union-skills
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # upload-artifact does not carry the executable bit; npm needs the bin
      # entry executable in the tarball it builds from this directory.
      - run: chmod +x pkg/bin/cli.mjs
      - name: npm publish
        run: npm publish ./pkg --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Only for a hand-pushed tag. When release.yml drives the release it creates
  # the GitHub release itself, with the changelog section as the notes, and
  # attaches the artifacts there.
  attach-assets:
    needs: [pypi]
    if: github.ref_type == 'tag' && inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Attach the published artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" release-assets/* \
            || gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
