name: ci

# Lint and test on every change. The content checks in tests/ are the ones that
# matter most: they guard the approval-gate vocabulary, the cross-skill links,
# and the absence of credentials in a payload that ships to users' machines.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "ruff>=0.6"
      - name: ruff check
        run: ruff check .
      # `ruff format` also formats Python code blocks inside the skills'
      # markdown, so this keeps the examples users copy-paste consistent.
      - name: ruff format --check
        run: ruff format --check .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the bundled scripts
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t scripts < <(find plugins -name '*.sh')
          printf 'checking %d script(s)\n' "${#scripts[@]}"
          test "${#scripts[@]}" -gt 0
          shellcheck --severity=warning "${scripts[@]}"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The installer CLI resolves home directories and copies trees, so it
        # gets exercised on both POSIX platforms CI can offer.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pytest build
      - run: python -m pytest
